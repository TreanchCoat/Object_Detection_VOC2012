# Baseline A2: bounding-box detection, ALL annotated VOC2012 images (minus official val), NO augmentation.
# Any value can be overridden from the CLI:  --set train.epochs=1 --set train.fraction=0.02

run:
  name: voc12_yolo11n_allimgs_baseline   # run id = <name>_<timestamp>
  project: runs                  # output root (relative to where you launch train.py)
  seed: 0
  strict_no_aug: true            # abort if any augmentation resolves to a non-zero value

data:
  task: detect                          # detect | segment
  voc_root: S:\Upgaming\VOCtrainval_11-May-2012\VOCdevkit          # folder that contains VOC2012/
  yolo_root: datasets/voc2012_det_all       # converted dataset is written here
  imageset: Main                        # ImageSets/<imageset>/<split>.txt  (Main = full detection splits)
  train_split: train
  val_split: val
  use_all_annotated: true               # train = every Annotations/*.xml image not in val; val = official Main val
  keep_difficult: false                 # false = drop objects flagged difficult (Ultralytics VOC convention)

model:
  # *.pt  -> start from pretrained (COCO) weights
  # *.yaml -> train from scratch, e.g. yolo11n.yaml
  weights: yolo11n.pt

train:
  epochs: 50
  imgsz: 512
  batch: 32
  optimizer: SGD          # explicit: "auto" would silently override lr0/momentum
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false
  box: 7.5
  cls: 0.5
  dfl: 1.5
  patience: 10
  workers: 4
  device: "0"              # "" = auto, or 0 / "cpu" / "mps"
  deterministic: true
  amp: true
  cache: false
  fraction: 1.0           # fraction of the train set to use (handy for smoke tests)
  close_mosaic: 0
  plots: true
  save_period: -1

# Everything augmentation-related, pinned to off. (Resize/letterbox to imgsz is not augmentation.)
augmentation:
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.0
  bgr: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.0
